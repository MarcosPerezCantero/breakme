# Datos SENSIBLES. 'stringData' deja escribirlos en claro aquí; Kubernetes los
# guarda codificados en base64 (NO cifrados). Por eso un Secret NO debería
# subirse a un repo público con valores reales: esto es solo de demostración.

apiVersion: v1
kind: Secret
metadata:
  name: breakme-secret
  namespace: breakme
type: Opaque
stringData:
  API_KEY: "clave-de-ejemplo-solo-demo"
