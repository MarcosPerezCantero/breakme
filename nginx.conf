# nginx hace de "reverse proxy": recibe las peticiones en el puerto 80 y las
# reparte entre las réplicas de BreakMe.

# 127.0.0.11 es el DNS interno de Docker. Lo consultamos en cada petición
# (por eso usamos una variable abajo) para que, al escalar réplicas, nginx
# descubra las nuevas y vaya rotando entre todas (round-robin).
resolver 127.0.0.11 valid=5s;

server {
    listen 80;

    location / {
        # Si pusiéramos "proxy_pass http://breakme:8000" directo, nginx
        # resolvería el nombre UNA sola vez al arrancar y siempre iría al
        # mismo contenedor. Con la variable, resuelve en cada petición.
        set $upstream breakme;
        proxy_pass http://$upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
