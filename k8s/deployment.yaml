# Un Deployment declara CUÁNTAS copias de la app queremos y de qué imagen.
# Kubernetes se encarga de crearlas y de mantener ese número siempre.

apiVersion: apps/v1
kind: Deployment            # el tipo de objeto que creamos
metadata:
  name: breakme             # nombre del Deployment
  namespace: breakme        # en nuestro cajón
spec:
  replicas: 3               # ESTADO DESEADO: quiero 3 pods corriendo

  # El Deployment gestiona los pods que lleven esta etiqueta.
  selector:
    matchLabels:
      app: breakme

  # Plantilla con la que se fabrica cada pod:
  template:
    metadata:
      labels:
        app: breakme        # cada pod nace con esta etiqueta (debe coincidir con el selector)
    spec:
      # --- Seguridad a nivel de POD: que NO corra como root ---
      securityContext:
        runAsNonRoot: true          # Kubernetes rechaza el pod si intentara ser root
        runAsUser: 10001            # el mismo uid que creamos en el Dockerfile (appuser)
        seccompProfile:
          type: RuntimeDefault      # perfil de llamadas al sistema restringido
      containers:
        - name: breakme
          image: ghcr.io/marcosperezcantero/breakme:1.0.0
          ports:
            - containerPort: 8000   # el puerto en el que escucha la app dentro del pod

          # --- Seguridad a nivel de CONTENEDOR: endurecido ---
          securityContext:
            allowPrivilegeEscalation: false   # no puede ganar privilegios
            readOnlyRootFilesystem: true      # el disco raíz es SOLO LECTURA
            capabilities:
              drop: ["ALL"]                   # le quitamos todos los permisos especiales del kernel

          # --- Configuración desde el ConfigMap (como variables de entorno) ---
          envFrom:
            - configMapRef:
                name: breakme-config

          # --- Un dato sensible desde el Secret ---
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: breakme-secret
                  key: API_KEY

          # Como el disco es de solo lectura, damos un /tmp escribible aparte.
          volumeMounts:
            - name: tmp
              mountPath: /tmp

          # --- Recursos: lo que reserva (requests) y su tope (limits) ---
          resources:
            requests:               # lo que el pod RESERVA (para que el scheduler lo coloque)
              cpu: 100m             # 100m = 0,1 de un núcleo
              memory: 64Mi
            limits:                 # el MÁXIMO. Pasarse de memoria => OOMKilled
              cpu: 500m
              memory: 256Mi

          # --- LIVENESS: ¿el proceso está vivo? Si falla => REINICIA el contenedor ---
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10       # comprueba cada 10s
            failureThreshold: 3     # tras 3 fallos seguidos, reinicia

          # --- READINESS: ¿puede recibir tráfico? Si falla => lo SACA del Service (no reinicia) ---
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 5
            failureThreshold: 3

          # --- STARTUP: da margen al arranque antes de aplicar la liveness ---
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 2
            failureThreshold: 30    # hasta 60s para arrancar

      # Volumen temporal escribible (porque el disco raíz es de solo lectura).
      volumes:
        - name: tmp
          emptyDir: {}
