# Compose describe TODO el sistema de forma declarativa: qué servicios hay,
# cómo se comunican y qué límites tienen. Se levanta con un solo comando.

services:
  # --- La app BreakMe -------------------------------------------------------
  breakme:
    image: breakme:1.0.0
    build: .                 # si la imagen no existe, la construye desde el Dockerfile
    # OJO: no ponemos container_name ni "ports" con puerto fijo del host,
    # para poder tener VARIAS réplicas (--scale breakme=3) sin chocar.
    expose:
      - "8000"               # visible SOLO dentro de la red de Compose, no en el host
    environment:
      APP_VERSION: "1.0.0"
    deploy:
      resources:
        limits:
          memory: 256m       # mismo límite que probamos a mano en la Fase 4
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # --- nginx como balanceador delante de las réplicas -----------------------
  nginx:
    image: nginx:alpine      # reaprovechamos la imagen de la Fase 1
    ports:
      - "8080:80"            # ESTE sí se publica al host: entramos por localhost:8080
    volumes:
      # Montamos nuestra config dentro del contenedor (solo lectura).
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - breakme
    restart: unless-stopped
