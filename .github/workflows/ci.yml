# CI de BreakMe: construye la imagen, la escanea con Trivy y, si pasa,
# la publica en GHCR. El despliegue (CD) se hace aparte, en local.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permisos mínimos que necesita el job: leer el código y escribir paquetes (GHCR).
permissions:
  contents: read
  packages: write

env:
  # Ruta de la imagen en GHCR, SIEMPRE en minúsculas.
  IMAGE: ghcr.io/marcosperezcantero/breakme

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      # 1. Traer el código del repo.
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Preparar Buildx (el constructor de imágenes moderno de Docker).
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Calcular los tags de la imagen automáticamente:
      #    - uno con el SHA corto del commit (único e inmutable)
      #    - 'latest' solo cuando el push es a la rama principal
      - name: Calcular tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # 4. Construir la imagen y cargarla en el daemon local (todavía NO se publica).
      #    Usamos caché de Actions para que builds siguientes sean rápidos.
      - name: Build (sin publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5. Escanear la imagen recién construida con Trivy.
      #    Falla el pipeline si hay vulnerabilidades CRÍTICAS con arreglo disponible.
      - name: Escaneo de seguridad (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          exit-code: '1'          # corta el pipeline si encuentra algo que cumpla el filtro
          ignore-unfixed: true    # ignora vulnerabilidades sin parche disponible
          severity: CRITICAL      # solo nos plantamos ante las críticas
          vuln-type: os,library

      # 6. Solo si el escaneo pasó: login en GHCR y publicar.
      #    (En pull_request no publicamos: solo build + scan como control de calidad.)
      - name: Login en GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar en GHCR
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
